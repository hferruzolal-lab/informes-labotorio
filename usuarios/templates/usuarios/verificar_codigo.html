<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
       body {
    margin: 0;
    background: linear-gradient(135deg, #eef3f9, #dce8f6);
    min-height: 100vh;
}

.contenedor {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 45px 14px 20px;
}

.card-codigo {
    width: 100%;
    max-width: 460px;
    min-width: 0;
    border: none;
    border-radius: 22px;
    overflow: hidden;
    background: white;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);
}

.card-header {
    background: linear-gradient(90deg, #198754, #20a765);
    color: white;
    text-align: center;
    padding: 30px 20px;
}

.card-header i {
    font-size: 62px;
    margin-bottom: 10px;
}

.card-header h2 {
    margin: 0;
    font-size: 30px;
    font-weight: bold;
}

.card-body {
    padding: 28px;
}

label {
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
}

input {
    width: 100%;
    border-radius: 12px;
    border: 1px solid #ced4da;
    padding: 13px 14px;
    font-size: 16px;
    background: #f8fbff;
    outline: none;
}

input:focus {
    border-color: #198754;
    box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.15);
    background: white;
}

.btn {
    border-radius: 12px;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
}

@media (max-width: 576px) {
    .contenedor {
        align-items: flex-start;
        padding: 35px 14px 20px;
    }

    .card-codigo {
        width: 100% !important;
        max-width: none !important;
        border-radius: 20px;
    }

    .card-header {
        padding: 26px 18px;
    }

    .card-header i {
        font-size: 54px;
    }

    .card-header h2 {
        font-size: 27px;
    }

    .card-body {
        padding: 24px 18px;
    }

    input {
        font-size: 16px;
        padding: 14px;
    }

    .btn {
        width: 100%;
        font-size: 16px;
        padding: 14px;
    }
}
    </style>
</head>

<body>

<div class="contenedor">

    <div class="card-codigo">

        <!-- TITULO -->

        <div class="card-header">

            <i class="bi bi-patch-check-fill"></i>

            <h2>
                Verificar Código
            </h2>

        </div>

        <!-- FORMULARIO -->

        <div class="card-body">

            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-4">

                    <label>
                        Código
                    </label>

                    <input type="text"
                           name="codigo"
                           placeholder="Ingrese el código"
                           inputmode="numeric"
                           required>

                </div>

                <button class="btn btn-success w-100">
                    <i class="bi bi-check-circle-fill"></i>
                    Verificar código
                </button>

            </form>

            <hr>

            <a href="{% url 'recuperar_password' %}" class="btn btn-secondary w-100">
                <i class="bi bi-arrow-left"></i>
                Volver
            </a>

        </div>

    </div>

</div>

</body>

</html>
