<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #eef3f9, #dce8f6);
            min-height: 100vh;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-password {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);
            background: white;
        }

        .card-header {
            background: linear-gradient(90deg, #0d6efd, #2f89ff);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .card-header i {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .card-header h2 {
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }

        .card-body {
            padding: 28px;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #ced4da;
            padding: 13px 14px;
            font-size: 16px;
            background: #f8fbff;
            outline: none;
        }

        input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
            background: white;
        }

        .btn {
            border-radius: 12px;
            padding: 13px;
            font-size: 16px;
            font-weight: 600;
        }

        .errorlist {
            color: #dc3545;
            margin-top: 8px;
            padding-left: 18px;
        }

        @media (max-width: 576px) {
            .contenedor {
                align-items: flex-start;
                padding: 25px 14px;
            }

            .card-password {
                max-width: 100%;
                border-radius: 20px;
            }

            .card-header {
                padding: 26px 18px;
            }

            .card-header h2 {
                font-size: 27px;
            }

            .card-header i {
                font-size: 54px;
            }

            .card-body {
                padding: 24px 18px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="card-password">

        <!-- TITULO -->

        <div class="card-header">
            <i class="bi bi-key-fill"></i>
            <h2>Cambiar contraseña</h2>
        </div>

        <!-- FORMULARIO -->

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Nueva contraseña</label>

                    <input type="password"
                           name="password"
                           placeholder="Ingrese la nueva contraseña"
                           required>

                    {{ form.password.errors }}
                </div>

                <div class="mb-4">
                    <label>Confirmar contraseña</label>

                    <input type="password"
                           name="confirmar"
                           placeholder="Repita la contraseña"
                           required>

                    {{ form.confirmar.errors }}
                </div>

                <button class="btn btn-primary w-100">
                    <i class="bi bi-save-fill"></i>
                    Guardar contraseña
                </button>

            </form>

            <hr>

            <a href="{% url 'login' %}" class="btn btn-secondary w-100">
                <i class="bi bi-arrow-left"></i>
                Volver
            </a>

        </div>

    </div>

</div>

</body>

</html>
