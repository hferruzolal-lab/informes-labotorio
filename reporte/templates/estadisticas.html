<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas Generales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #eef3f9, #dce8f6);
            min-height: 100vh;
        }

        .contenedor {
            max-width: 1150px;
            margin: auto;
            padding: 55px 16px 25px;
        }

        .card-principal {
            border: none;
            border-radius: 22px;
            overflow: hidden;
            background: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);
            margin-bottom: 25px;
        }

        .titulo {
            background: #212529;
            color: white;
            padding: 22px 24px;
        }

        .titulo h2 {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
        }

        .resumen {
            padding: 24px;
        }

        .card-numero {
            color: white;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
        }

        .card-numero h5 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .card-numero h2 {
            font-size: 38px;
            font-weight: bold;
            margin: 0;
        }

        .grafico-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
            height: 100%;
        }

        .grafico-header {
            color: white;
            padding: 14px 18px;
            font-weight: bold;
            font-size: 18px;
        }

        .grafico-body {
            padding: 20px;
            height: 320px;
        }

        .grafico-body canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .btn {
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 600;
        }

        @media (max-width: 576px) {
            .contenedor {
                padding: 35px 12px 20px;
            }

            .titulo {
                text-align: center;
                padding: 20px 16px;
            }

            .titulo h2 {
                font-size: 25px;
            }

            .resumen {
                padding: 18px 14px;
            }

            .card-numero {
                padding: 20px;
            }

            .card-numero h5 {
                font-size: 18px;
            }

            .card-numero h2 {
                font-size: 34px;
            }

            .grafico-header {
                font-size: 16px;
                text-align: center;
            }

            .grafico-body {
                height: 280px;
                padding: 16px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="card-principal">

        <div class="titulo">
            <h2>
                <i class="bi bi-bar-chart-fill"></i>
                Estadísticas Generales
            </h2>
        </div>

        <div class="resumen">

            <div class="row g-3">

                <div class="col-md-4">
                    <div class="card-numero bg-danger">
                        <h5>Pendientes</h5>
                        <h2>{{ pendientes }}</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card-numero bg-warning text-dark">
                        <h5>En proceso</h5>
                        <h2>{{ proceso }}</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card-numero bg-success">
                        <h5>Resueltos</h5>
                        <h2>{{ resueltos }}</h2>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <div class="row g-4">

        <div class="col-md-6">
            <div class="grafico-card">
                <div class="grafico-header bg-primary">
                    <i class="bi bi-building"></i>
                    Reportes por laboratorio
                </div>
                <div class="grafico-body">
                    <canvas id="graficoLaboratorio"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="grafico-card">
                <div class="grafico-header bg-success">
                    <i class="bi bi-calendar-month"></i>
                    Reportes por mes
                </div>
                <div class="grafico-body">
                    <canvas id="graficoMes"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="grafico-card">
                <div class="grafico-header bg-info">
                    <i class="bi bi-person-fill"></i>
                    Reportes por usuario
                </div>
                <div class="grafico-body">
                    <canvas id="graficoUsuario"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="grafico-card">
                <div class="grafico-header bg-secondary">
                    <i class="bi bi-pie-chart-fill"></i>
                    Resueltos vs pendientes
                </div>
                <div class="grafico-body">
                    <canvas id="graficoEstado"></canvas>
                </div>
            </div>
        </div>

    </div>

    <a href="/reporte/" class="btn btn-primary mt-4">
        <i class="bi bi-arrow-left"></i>
        Volver al panel
    </a>

</div>

<script>
    const laboratoriosLabels = JSON.parse('{{ laboratorios_labels|default:"[]"|escapejs }}');
    const laboratoriosData = JSON.parse('{{ laboratorios_data|default:"[]"|escapejs }}');

    const mesesLabels = JSON.parse('{{ meses_labels|default:"[]"|escapejs }}');
    const mesesData = JSON.parse('{{ meses_data|default:"[]"|escapejs }}');

    const usuariosLabels = JSON.parse('{{ usuarios_labels|default:"[]"|escapejs }}');
    const usuariosData = JSON.parse('{{ usuarios_data|default:"[]"|escapejs }}');

    const estadosLabels = JSON.parse('{{ estados_labels|default:"[]"|escapejs }}');
    const estadosData = JSON.parse('{{ estados_data|default:"[]"|escapejs }}');

    new Chart(document.getElementById("graficoLaboratorio"), {
        type: "bar",
        data: {
            labels: laboratoriosLabels,
            datasets: [{
                label: "Cantidad de reportes",
                data: laboratoriosData,
                backgroundColor: "#0d6efd"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    new Chart(document.getElementById("graficoMes"), {
        type: "bar",
        data: {
            labels: mesesLabels,
            datasets: [{
                label: "Reportes por mes",
                data: mesesData,
                backgroundColor: "#198754"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    new Chart(document.getElementById("graficoUsuario"), {
        type: "bar",
        data: {
            labels: usuariosLabels,
            datasets: [{
                label: "Reportes por usuario",
                data: usuariosData,
                backgroundColor: "#0dcaf0"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    new Chart(document.getElementById("graficoEstado"), {
        type: "pie",
        data: {
            labels: estadosLabels,
            datasets: [{
                data: estadosData,
                backgroundColor: [
                    "#dc3545",
                    "#ffc107",
                    "#198754"
                ]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
</script>
</html>
