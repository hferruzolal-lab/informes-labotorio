<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Estadísticas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="card shadow-lg mb-4">

        <div class="card-header bg-dark text-white">

            <h2>
                <i class="bi bi-bar-chart-fill"></i>
                Estadísticas Generales
            </h2>

        </div>

        <div class="card-body">

            <div class="row text-center">

                <div class="col-md-4 mb-3">

                    <div class="card bg-danger text-white shadow">

                        <div class="card-body">

                            <h5>Pendientes</h5>

                            <h2>{{ pendientes }}</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4 mb-3">

                    <div class="card bg-warning text-dark shadow">

                        <div class="card-body">

                            <h5>En proceso</h5>

                            <h2>{{ proceso }}</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4 mb-3">

                    <div class="card bg-success text-white shadow">

                        <div class="card-body">

                            <h5>Resueltos</h5>

                            <h2>{{ resueltos }}</h2>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h5>
                        <i class="bi bi-building"></i>
                        Reportes por laboratorio
                    </h5>

                </div>

                <div class="card-body">

                    <canvas id="graficoLaboratorios"></canvas>

                </div>

            </div>

        </div>

        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h5>
                        <i class="bi bi-calendar-month"></i>
                        Reportes por mes
                    </h5>

                </div>

                <div class="card-body">

                    <canvas id="graficoMeses"></canvas>

                </div>

            </div>

        </div>

        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-header bg-info text-white">

                    <h5>
                        <i class="bi bi-person-fill"></i>
                        Reportes por usuario
                    </h5>

                </div>

                <div class="card-body">

                    <canvas id="graficoUsuarios"></canvas>

                </div>

            </div>

        </div>

        <div class="col-md-6 mb-4">

            <div class="card shadow">

                <div class="card-header bg-secondary text-white">

                    <h5>
                        <i class="bi bi-pie-chart-fill"></i>
                        Resueltos vs pendientes
                    </h5>

                </div>

                <div class="card-body">

                    <canvas id="graficoEstados"></canvas>

                </div>

            </div>

        </div>

    </div>

    <a href="/reporte/" class="btn btn-primary">

        <i class="bi bi-arrow-left"></i>

        Volver al panel

    </a>

</div>

<script>

    const laboratoriosLabels = {{ laboratorios_labels|safe }};
    const laboratoriosData = {{ laboratorios_data|safe }};

    const mesesLabels = {{ meses_labels|safe }};
    const mesesData = {{ meses_data|safe }};

    const usuariosLabels = {{ usuarios_labels|safe }};
    const usuariosData = {{ usuarios_data|safe }};

    const estadosLabels = {{ estados_labels|safe }};
    const estadosData = {{ estados_data|safe }};


    new Chart(document.getElementById("graficoLaboratorios"), {
        type: "bar",
        data: {
            labels: laboratoriosLabels,
            datasets: [{
                label: "Cantidad de reportes",
                data: laboratoriosData
            }]
        }
    });


    new Chart(document.getElementById("graficoMeses"), {
        type: "line",
        data: {
            labels: mesesLabels,
            datasets: [{
                label: "Reportes por mes",
                data: mesesData
            }]
        }
    });


    new Chart(document.getElementById("graficoUsuarios"), {
        type: "bar",
        data: {
            labels: usuariosLabels,
            datasets: [{
                label: "Reportes por usuario",
                data: usuariosData
            }]
        }
    });


    new Chart(document.getElementById("graficoEstados"), {
        type: "doughnut",
        data: {
            labels: estadosLabels,
            datasets: [{
                label: "Estados",
                data: estadosData
            }]
        }
    });

</script>

</body>

</html>
