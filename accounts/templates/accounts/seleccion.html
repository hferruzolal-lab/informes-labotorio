<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reporte de Daños</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #eef3f9, #dbe7f5);
            min-height: 100vh;
        }

        .card-principal {
            border-radius: 22px;
            overflow: hidden;
            max-width: 850px;
            width: 100%;
        }

        .card-header {
            padding: 25px;
        }

        .card-header h2 {
            font-size: 32px;
            font-weight: bold;
        }

        .contenedor-opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 35px;
        }

        .opcion {
            background: #f8fbff;
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #e3eaf3;
            transition: 0.2s ease;
        }

        .opcion:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .opcion i {
            font-size: 85px;
        }

        .opcion h3 {
            margin-top: 18px;
            font-size: 28px;
            font-weight: bold;
        }

        .opcion p {
            color: #666;
            font-size: 15px;
            min-height: 45px;
        }

        .opcion .btn {
            border-radius: 12px;
            padding: 12px 35px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .container {
                margin-top: 25px !important;
            }

            .card-principal {
                max-width: 95%;
            }

            .card-header h2 {
                font-size: 24px;
            }

            .card-header p {
                font-size: 14px;
            }

            .contenedor-opciones {
                grid-template-columns: 1fr;
                padding: 22px;
                gap: 18px;
            }

            .opcion {
                padding: 24px 18px;
            }

            .opcion i {
                font-size: 75px;
            }

            .opcion h3 {
                font-size: 25px;
            }

            .opcion .btn {
                width: 100%;
            }
        }
    </style>

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-12 d-flex justify-content-center">

            <div class="card shadow-lg border-0 card-principal">

                <div class="card-header bg-primary text-white text-center">

                    <h2>
                        <i class="bi bi-shield-lock-fill"></i>
                        Reporte de Daños
                    </h2>

                    <p class="mb-0">
                        Seleccione el tipo de acceso
                    </p>

                </div>

                <div class="card-body p-0">

                    <div class="contenedor-opciones">

                        <div class="opcion">

                            <i class="bi bi-person-circle text-primary"></i>

                            <h3>
                                Usuario
                            </h3>

                            <p>
                                Registrar daños y consultar sus reportes.
                            </p>

                            <a href="/acceso/?tipo=usuario"
                               class="btn btn-primary btn-lg">
                                Ingresar
                            </a>

                        </div>

                        <div class="opcion">

                            <i class="bi bi-person-workspace text-danger"></i>

                            <h3>
                                Administrador
                            </h3>

                            <p>
                                Administración completa del sistema.
                            </p>

                            <a href="/acceso/?tipo=admin"
                               class="btn btn-danger btn-lg">
                                Ingresar
                            </a>

                        </div>

                    </div>

                </div>

                <div class="card-footer text-center">

                    <small>
                        © 2026 Reporte de Daños
                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
