<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #f4f7fb, #e8f0f8);
            min-height: 100vh;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 70px 20px 20px;
        }

        .card-error {
            width: 100%;
            max-width: 720px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
            background: white;
        }

        .card-header {
            background: #ffc107;
            color: #111;
            text-align: center;
            padding: 22px 18px;
        }

        .card-header h1 {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
        }

        .card-body {
            text-align: center;
            padding: 34px 26px;
        }

        .mensaje-principal {
            font-size: 27px;
            color: #111827;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .mensaje-secundario {
            font-size: 21px;
            color: #555;
            margin-bottom: 26px;
        }

        .btn-volver {
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 19px;
            font-weight: 600;
        }

        @media (max-width: 576px) {
            .contenedor {
                padding: 35px 14px 20px;
            }

            .card-error {
                max-width: 100%;
                border-radius: 18px;
            }

            .card-header h1 {
                font-size: 27px;
            }

            .card-body {
                padding: 28px 18px;
            }

            .mensaje-principal {
                font-size: 22px;
            }

            .mensaje-secundario {
                font-size: 17px;
            }

            .btn-volver {
                width: 100%;
                font-size: 17px;
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="card card-error">

        <!-- TITULO -->

        <div class="card-header">
            <h1>
                <i class="bi bi-lock-fill"></i>
                Acceso denegado
            </h1>
        </div>

        <!-- MENSAJE -->

        <div class="card-body">

            <p class="mensaje-principal">
                No puedes ingresar como usuario usando una cuenta administradora.
            </p>

            <p class="mensaje-secundario">
                Debes ingresar desde la opción Administrador.
            </p>

            <a href="/" class="btn btn-primary btn-volver">
                <i class="bi bi-arrow-left"></i>
                Volver al inicio
            </a>

        </div>

    </div>

</div>

</body>

</html>
