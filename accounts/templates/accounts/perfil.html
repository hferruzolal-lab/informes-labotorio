<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #eef3f9, #dce8f6);
            min-height: 100vh;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 55px 16px 20px;
        }

        .card-perfil {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 22px;
            overflow: hidden;
            background: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);
        }

        .perfil-header {
            background: linear-gradient(90deg, #0d6efd, #2f89ff);
            color: white;
            text-align: center;
            padding: 30px 18px;
        }

        .perfil-header i {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .perfil-header h2 {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
        }

        .perfil-body {
            padding: 28px;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #ced4da;
            padding: 14px;
            font-size: 16px;
            background: #f8fbff;
            outline: none;
        }

        input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
            background: white;
        }

        .btn {
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
        }

        @media (max-width: 576px) {
            .contenedor {
                padding: 35px 14px 20px;
            }

            .card-perfil {
                max-width: 100%;
                border-radius: 20px;
            }

            .perfil-header {
                padding: 28px 18px;
            }

            .perfil-header i {
                font-size: 52px;
            }

            .perfil-header h2 {
                font-size: 28px;
            }

            .perfil-body {
                padding: 24px 18px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="card-perfil">

        <div class="perfil-header">
            <i class="bi bi-person-circle"></i>
            <h2>Mi Perfil</h2>
        </div>

        <div class="perfil-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Nombre de usuario</label>
                    <input type="text"
                           name="username"
                           value="{{ form.username.value|default:'' }}"
                           required>
                </div>

                <div class="mb-4">
                    <label>Correo electrónico</label>
                    <input type="email"
                           name="email"
                           value="{{ form.email.value|default:'' }}"
                           required>
                </div>

                <button class="btn btn-success w-100 mb-2">
                    <i class="bi bi-save"></i>
                    Guardar cambios
                </button>

            </form>

            <a href="/reporte/" class="btn btn-secondary w-100">
                <i class="bi bi-arrow-left"></i>
                Volver
            </a>

        </div>

    </div>

</div>

</body>

</html>
